version: 2

env:
  - CGO_ENABLED=0

builds:
  - id: linkpage
    goos:
      - linux
      - darwin

archives:
  - ids:
      - linkpage
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

dockers_v2:
  - ids:
      - linkpage
    images:
      - "rhnvrm/linkpage"
    tags:
      - latest
      - "{{ .Tag }}"
    dockerfile: Dockerfile
    extra_files:
      - config.sample.toml
    platforms:
      - linux/amd64
